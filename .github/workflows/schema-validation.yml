name: Schema and syntax validation

on:
  push:
    branches: ['**']
  pull_request:
    paths:
      - 'inc/Databases/createDatabase.sql'
      - 'inc/Classes/Accounting/**'
      - '.github/workflows/schema-validation.yml'
  workflow_dispatch:

jobs:
  schema-import:
    name: Import schema on MariaDB ${{ matrix.mariadb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.5.29', '10.11']
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: justm_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Import createDatabase.sql
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client
          mysql --skip-ssl -h127.0.0.1 -uroot -ptest justm_test --default-character-set=utf8mb4 < inc/Databases/createDatabase.sql
      - name: Report tables, procedures and reference rows
        run: |
          q() { mysql --skip-ssl -h127.0.0.1 -uroot -ptest cptest -N -e "$1"; }
          echo "tables:     $(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='cptest' AND table_type='BASE TABLE'")"
          echo "procedures: $(q "SELECT COUNT(*) FROM information_schema.routines WHERE routine_schema='cptest'")"
          echo "accounts:   $(q "SELECT COUNT(*) FROM accounts")"
          q "SHOW TABLES LIKE 'journal%'"
          echo "views:      $(q "SELECT COUNT(*) FROM information_schema.views WHERE table_schema='cptest'")"
          q "SELECT COUNT(*) FROM product_options_view"
          q "SELECT COUNT(*) FROM purchases_orders_view"
          test "$(q "SELECT COUNT(*) FROM information_schema.views WHERE table_schema='cptest'")" = "4"
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none, extensions: pdo_mysql }
      - name: Courier delivery accounting test
        run: php tests/accounting/courier_delivery_test.php 127.0.0.1 root test
      - name: Phase 1 accounts and settings (and migration is idempotent)
        run: |
          q() { mysql --skip-ssl -h127.0.0.1 -uroot -ptest cptest -N -e "$1"; }
          mysql --skip-ssl -h127.0.0.1 -uroot -ptest cptest --default-character-set=utf8mb4 < inc/Databases/migrations/PHASE1_DELIVERY_CUSTODY_AND_COMMISSION_ACCOUNTS.sql
          mysql --skip-ssl -h127.0.0.1 -uroot -ptest cptest --default-character-set=utf8mb4 < inc/Databases/migrations/PHASE1G_MARKETER_COMMISSION_ACCOUNTS.sql
          mysql --skip-ssl -h127.0.0.1 -uroot -ptest cptest --default-character-set=utf8mb4 < inc/Databases/migrations/ACCOUNTING_COMPLETE_MIGRATION.sql
          mysql --skip-ssl -h127.0.0.1 -uroot -ptest cptest --default-character-set=utf8mb4 < inc/Databases/migrations/ACCOUNTING_COMPLETE_MIGRATION.sql
          test "$(q "SELECT COUNT(*) FROM accounts WHERE account_code = '3300'")" = "1"
          test "$(q "SELECT COUNT(*) FROM account_settings WHERE setting_key = 'OPENING_BALANCE_EQUITY'")" = "1"
          q "SELECT COUNT(*) FROM gl_trial_balance"
          q "SELECT COUNT(*) FROM gl_partner_balances"
          test "$(q "SELECT COUNT(*) FROM accounts WHERE account_code IN ('5710','2220')")" = "2"
          test "$(q "SELECT COUNT(*) FROM account_settings WHERE setting_key IN ('MARKETER_COMMISSION','MARKETER_COMMISSION_PAYABLE')")" = "2"
          q "SELECT s.setting_key, a.account_code, a.account_name, a.parent_id FROM account_settings s JOIN accounts a ON a.id=s.account_id WHERE s.setting_key IN ('DELIVERY_CUSTODY','DELIVERY_COMMISSION_PAYABLE','DELIVERY_COMMISSION','CUSTOMERS','SALES','SHIPPING_REVENUE','COGS','INVENTORY')"
          test "$(q "SELECT COUNT(*) FROM accounts WHERE account_code IN ('1510','2210')")" = "2"
          test "$(q "SELECT COUNT(*) FROM account_settings WHERE setting_key IN ('DELIVERY_CUSTODY','DELIVERY_COMMISSION_PAYABLE')")" = "2"
  php-syntax:
    name: PHP syntax (accounting, finance, shipment, inventory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.2', coverage: none }
      - run: |
          find inc/Classes/Accounting -name '*.php' -print0 | xargs -0 -n1 php -l
          for f in inc/controller/BackEnd/finance_BE.php inc/controller/BackEnd/shipment_BE.php inc/controller/BackEnd/inventory_BE.php inc/controller/BackEnd/accounts_BE.php inc/controller/BackEnd/PaymentDisbursement_BE.php inc/controller/BackEnd/reports_BE.php inc/Classes/InventoryManager.php inc/routes/delivery_router.php inc/routes/admin_router.php inc/controller/shipment.control.php inc/Classes/CourierReopen.php inc/Classes/Accounting/OpeningBalanceManager.php inc/Classes/Accounting/LegacyMigration.php inc/Classes/user_permission.php inc/template/SidebarMenu.php inc/Views/CourierReopen.php; do php -l "$f"; done
